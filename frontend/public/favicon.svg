<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background: rounded square with gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="doc" x1="18" y1="10" x2="46" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E0FF"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Document shape with folded corner -->
  <path d="M18 12 H38 L46 20 V52 Q46 54 44 54 H20 Q18 54 18 52 Z" fill="url(#doc)" opacity="0.95"/>
  <!-- Folded corner -->
  <path d="M38 12 V18 Q38 20 40 20 H46" fill="none" stroke="#4F46E5" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M38 12 L46 20 H40 Q38 20 38 18 Z" fill="#C7C3FF" opacity="0.7"/>

  <!-- Text lines on document -->
  <rect x="23" y="26" width="18" height="2.5" rx="1.25" fill="#6C63FF" opacity="0.5"/>
  <rect x="23" y="32" width="14" height="2.5" rx="1.25" fill="#6C63FF" opacity="0.4"/>
  <rect x="23" y="38" width="16" height="2.5" rx="1.25" fill="#6C63FF" opacity="0.3"/>

  <!-- Blinking cursor -->
  <rect x="23" y="44" width="2" height="6" rx="1" fill="#4F46E5" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Sync arrows (bottom-right) -->
  <g transform="translate(42, 42)">
    <circle cx="8" cy="8" r="9" fill="#1E1B4B" opacity="0.85"/>
    <!-- Top-right arrow (clockwise) -->
    <path d="M5 5.5 A4 4 0 0 1 12 7" stroke="#A5B4FC" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M11 5 L12 7 L10 7.5" stroke="#A5B4FC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Bottom-left arrow (counter-clockwise) -->
    <path d="M11 10.5 A4 4 0 0 1 4 9" stroke="#A5B4FC" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M5 11 L4 9 L6 8.5" stroke="#A5B4FC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
