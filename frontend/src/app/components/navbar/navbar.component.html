<nav class="navbar">
  <div class="navbar__left">
    <span class="navbar__brand">SyncPad</span>
    <div class="navbar__divider"></div>
    <input
      class="navbar__doc-title-input"
      type="text"
      [value]="documentTitle"
      (input)="onTitleInput($event)"
      (focus)="onTitleFocus()"
      (blur)="onTitleBlur()"
      (keydown.enter)="onTitleEnter($event)"
      spellcheck="false"
      id="input-doc-title"
      aria-label="Document title"
    />

    <div class="navbar__divider"></div>

    <!-- Connection Status + Collaborator Count -->
    <div class="navbar__presence">
      <span class="navbar__dot-wrapper">
        <span class="navbar__dot-ping"
              [class.navbar__dot-ping--connected]="(status$ | async) === 'connected'"
              [class.navbar__dot-ping--disconnected]="(status$ | async) === 'disconnected'">
        </span>
        <span class="navbar__dot"
              [class.navbar__dot--connected]="(status$ | async) === 'connected'"
              [class.navbar__dot--disconnected]="(status$ | async) === 'disconnected'">
        </span>
      </span>
      @switch (status$ | async) {
        @case ('connected') {
          <span class="navbar__status-label">Connected</span>
        }
        @case ('connecting') {
          <span class="navbar__status-label">Connecting…</span>
        }
        @case ('disconnected') {
          <span class="navbar__status-label navbar__status-label--warn">Disconnected</span>
        }
      }

      <div class="navbar__presence-sep"></div>

      <!-- Collaborator count chip -->
      <span class="navbar__collab-chip" title="Active collaborators">
        <span class="material-symbols-outlined navbar__collab-icon">person</span>
        <span class="navbar__collab-count">{{ collaboratorCount$ | async }}</span>
      </span>
    </div>
  </div>

  <div class="navbar__right">
    <!-- Font Size Slider -->
    <div class="navbar__font-size">
      <span class="navbar__font-size-label navbar__font-size-label--small">A</span>
      <input
        type="range"
        class="navbar__font-size-slider"
        [min]="12"
        [max]="24"
        [value]="fontSize"
        (input)="onFontSizeChange($event)"
        id="range-font-size-topbar"
        aria-label="Font size"
      />
      <span class="navbar__font-size-label navbar__font-size-label--large">A</span>
      <span class="navbar__font-size-value">{{ fontSize }}px</span>
    </div>

    <div class="navbar__divider"></div>

    <button class="navbar__btn navbar__btn--text" (click)="copyLink()" id="btn-copy-link">
      <span class="navbar__btn-label">Copy Link</span>
    </button>
    <button class="navbar__btn navbar__btn--primary" (click)="downloadFile()" id="btn-download">
      <span class="material-symbols-outlined navbar__btn-icon">download</span>
      <span class="navbar__btn-label">Download</span>
    </button>

    <div class="navbar__divider"></div>

    <!-- Theme Toggle -->
    <button class="navbar__icon-btn" (click)="toggleTheme()" id="btn-theme" [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'">
      <span class="material-symbols-outlined">{{ isDarkMode ? 'dark_mode' : 'light_mode' }}</span>
    </button>
    <button class="navbar__icon-btn" (click)="openSettings()" id="btn-settings" aria-label="Settings">
      <span class="material-symbols-outlined">settings</span>
    </button>
    <button class="navbar__icon-btn" (click)="openHelp()" id="btn-help" aria-label="Help">
      <span class="material-symbols-outlined">help</span>
    </button>
  </div>
</nav>
