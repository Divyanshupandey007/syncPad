@if (isOpen$ | async) {
  <div class="modal-overlay" (click)="onOverlayClick($event)">
    <div class="settings-card" role="dialog" aria-labelledby="settings-title">

      <!-- Header -->
      <div class="settings-header">
        <h2 id="settings-title" class="settings-header__title">Editor Settings</h2>
        <button class="settings-header__close" (click)="close()" aria-label="Close">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <!-- Body -->
      <div class="settings-body">

        <!-- EDITOR Section -->
        <div class="settings-section">
          <h3 class="settings-section__label">Editor</h3>

          <!-- Syntax Language -->
          <div class="settings-field">
            <label class="settings-field__label">Syntax Language</label>
            <div class="settings-select-wrapper">
              <select class="settings-select" [(ngModel)]="syntaxLanguage" (ngModelChange)="onLanguageChange()" id="select-syntax">
                @for (lang of languages; track lang) {
                  <option [value]="lang">{{ lang }}</option>
                }
              </select>
              <span class="material-symbols-outlined settings-select__chevron">expand_more</span>
            </div>
          </div>

          <!-- Format Code -->
          <div class="settings-field">
            <div class="settings-field__header">
              <label class="settings-field__label">Format Code</label>
              @if (formatStatus) {
                <span class="settings-field__status" [class.settings-field__status--success]="formatStatus.startsWith('✓')" [class.settings-field__status--error]="formatStatus.startsWith('✗')">
                  {{ formatStatus }}
                </span>
              }
            </div>
            <button
              class="settings-format-btn"
              [class.settings-format-btn--disabled]="!canFormat || isFormatting"
              [disabled]="!canFormat || isFormatting"
              (click)="formatCode()"
              id="btn-format-code"
            >
              <span class="material-symbols-outlined settings-format-btn__icon">auto_fix_high</span>
              @if (isFormatting) {
                <span>Formatting...</span>
              } @else if (canFormat) {
                <span>Format {{ syntaxLanguage }}</span>
              } @else {
                <span>Formatting not available for {{ syntaxLanguage }}</span>
              }
            </button>
          </div>

          <!-- Line Numbers -->
          <div class="settings-row settings-row--spaced">
            <div class="settings-row__info">
              <span class="settings-row__title">Line Numbers</span>
              <span class="settings-row__subtitle">Show gutter numbers</span>
            </div>
            <label class="toggle" id="toggle-line-numbers">
              <input type="checkbox" class="toggle__input" [(ngModel)]="lineNumbers">
              <span class="toggle__track">
                <span class="toggle__thumb"></span>
              </span>
            </label>
          </div>

          <!-- Word Wrap -->
          <div class="settings-row settings-row--spaced">
            <div class="settings-row__info">
              <span class="settings-row__title">Word Wrap</span>
              <span class="settings-row__subtitle">Wrap long lines to editor width</span>
            </div>
            <label class="toggle" id="toggle-word-wrap">
              <input type="checkbox" class="toggle__input" [(ngModel)]="wordWrap">
              <span class="toggle__track" [class.toggle__track--off]="!wordWrap">
                <span class="toggle__thumb"></span>
              </span>
            </label>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="settings-footer">
        <button class="settings-footer__btn settings-footer__btn--outline" (click)="resetDefaults()" id="btn-reset">
          Reset Defaults
        </button>
        <button class="settings-footer__btn settings-footer__btn--primary" (click)="save()" id="btn-save">
          Save Changes
        </button>
      </div>
    </div>
  </div>
}
