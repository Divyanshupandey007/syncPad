server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Serve Angular SPA ---
    # For any route that doesn't match a real file, serve index.html
    # so Angular's client-side router handles the path (e.g. /abc123).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Cache control for index.html ---
    # Always fetch the latest index.html so new deployments take effect
    # immediately without the user needing to hard-refresh.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # --- Cache hashed assets (JS/CSS chunks) ---
    # Angular outputs filenames with content hashes (e.g. main.abc123.js),
    # so they can be cached aggressively — the filename changes on rebuild.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Reverse Proxy: WebSocket connections ---
    # Forward /ws/{documentId} to the Go backend running on port 3000.
    # "backend" is the Docker Compose service name (acts as hostname).
    location /ws/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        # These headers are REQUIRED for WebSocket upgrade handshake.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Keep WebSocket connections alive (default 60s timeout is too short).
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
