services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: syncpad
      POSTGRES_DB: syncpad
      POSTGRES_PASSWORD: syncpad123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:8
    ports:
      - "6379:6379"

volumes:
  pgdata: